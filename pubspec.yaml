name: vasx_ui
description: >
  vasX UI — a collection of beautiful, reusable Flutter widgets including
  smart dropdowns, date pickers, multi-step wizards, animated popup menus,
  and responsive data tables. Built for production-grade Flutter apps.
version: 0.0.1
homepage: https://github.com/harveedesigns/vasx_ui

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <1.0.0"
  fl_chart: ">=0.69.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
