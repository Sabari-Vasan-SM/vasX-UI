name: vasx_ui
description: >
  vasX UI — a collection of beautiful, reusable Flutter widgets including
  smart dropdowns, date pickers, multi-step wizards, animated popup menus,
  and responsive data tables. Built for production-grade Flutter apps.
version: 2.0.0
homepage: https://github.com/Sabari-Vasan-SM/vasX-UI.git

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
